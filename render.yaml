services:
  # CampusHub Python Flask Backend Service
  - type: web
    name: campushub-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campushub-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  # Managed PostgreSQL Database on Render
  - name: campushub-db
    plan: free
    databaseName: campushub
    user: campushub_user
